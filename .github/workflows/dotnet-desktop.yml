name: Build LuaTools

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore LuaToolsGui.sln

    - name: Build
      run: dotnet build LuaToolsGui.sln --configuration Release --no-restore

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LuaTools-Release
        path: src/LuaToolsGui/bin/Release/net8.0-windows/
